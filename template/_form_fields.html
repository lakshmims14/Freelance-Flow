{% if form.non_field_errors %}
  <div class="alert alert-danger">{{ form.non_field_errors }}</div>
{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
    {% for error in field.errors %}<div class="text-danger small mt-1"><i class="bi bi-exclamation-circle"></i> {{ error }}</div>{% endfor %}
  </div>
{% endfor %}
