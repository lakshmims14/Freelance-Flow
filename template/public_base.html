{% load static %}<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <title>{% block title %}FreelanceFlow{% endblock %}</title>
  {% include "_head.html" %}
</head>
<body class="pub">
<nav class="pub-nav">
  <div class="inner">
    <a class="ff-brand" style="padding:0" href="{% url 'home' %}"><span class="ff-mark"><i class="bi bi-currency-rupee"></i></span>FreelanceFlow</a>
    <div class="links">
      {% block navlinks %}<a class="plain d-none d-sm-inline-block" href="{% url 'login' %}">Log in</a>{% endblock %}
      <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up free</a>
    </div>
  </div>
</nav>

{% if messages %}<div class="pub-wrap pt-3">{% include "_messages.html" %}</div>{% endif %}
{% block body %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
